services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '5433:5432'
    environment:
      POSTGRES_DB: fabrmatch_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: quay.io/minio/minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

  # creates the S3_BUCKET once MinIO is up (uploads fail silently without it)
  minio-init:
    image: quay.io/minio/mc
    depends_on:
      - minio
    restart: 'no'
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 minioadmin minioadmin >/dev/null 2>&1;
      do sleep 1; done; mc mb --ignore-existing local/fabrmatch"

  # local SMTP catcher: SMTP_HOST=localhost SMTP_PORT=1025, inbox at http://localhost:8025
  mailpit:
    image: axllent/mailpit
    ports:
      - '1025:1025'
      - '8025:8025'

  # optional antivirus: `docker compose --profile av up -d clamav`, then CLAMAV_HOST=localhost
  # (debian image: multi-arch; the alpine one has no arm64)
  clamav:
    image: clamav/clamav-debian:stable
    profiles: ['av']
    ports:
      - '3310:3310'

volumes:
  pgdata:
  miniodata:
